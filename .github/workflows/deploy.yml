name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        env:
          REACT_APP_FIREBASE_CONFIG: ${{ secrets.REACT_APP_FIREBASE_CONFIG }}
          REACT_APP_FIRESTORE_KEYS_COLLECTION_NAME: ${{ secrets.REACT_APP_FIRESTORE_KEYS_COLLECTION_NAME }}
          REACT_APP_FIRESTORE_USERS_COLLECTION_NAME: ${{ secrets.REACT_APP_FIRESTORE_USERS_COLLECTION_NAME }}
          REACT_APP_FIRESTORE_VAULTS_COLLECTION_NAME: ${{ secrets.REACT_APP_FIRESTORE_VAULTS_COLLECTION_NAME }}
        run: npm run build

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          npx gh-pages -d build -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" -r https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git


